<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanya's Arcade</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Tanya's Arcade</h1>
        <p class="tagline">Games I made myself. Pick one and play!</p>
    </header>

    <main class="game-grid">

        <!-- ============================================================
             TO ADD A NEW GAME: copy one whole <a> block below, paste it
             underneath, then change three things:
               1. the href, to your new game's folder
               2. the emoji
               3. the title and the description
             ============================================================ -->

        <a class="game-card" href="games/LabubuCatch/">
            <span class="game-emoji">🛁</span>
            <span class="game-title">Catch the Labubu</span>
            <span class="game-blurb">Catch Labubus and toilet paper. Dodge the poop!</span>
        </a>

        <a class="game-card" href="games/Snake/">
            <span class="game-emoji">🐍</span>
            <span class="game-title">Snake</span>
            <span class="game-blurb">Eat your veggies, grow longer, don't bite your own tail.</span>
        </a>

        <div class="game-card coming-soon">
            <span class="game-emoji">✨</span>
            <span class="game-title">Next game</span>
            <span class="game-blurb">Being built right now...</span>
        </div>

    </main>

    <footer>
        <p>Made by Tanya 🎮</p>
    </footer>

</body>
</html>
